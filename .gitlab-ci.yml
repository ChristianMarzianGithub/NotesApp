# Optional validation on the downstream mirror; development remains on GitHub.
variables:
  GIT_SUBMODULE_STRATEGY: recursive
stages: [test, containers]
backend:
  stage: test
  image: maven:3.9.11-eclipse-temurin-25
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: notesapp_test
    POSTGRES_USER: notesapp
    POSTGRES_PASSWORD: notesapp_dev_only
    TEST_DATABASE_URL: jdbc:postgresql://postgres:5432/notesapp_test
    MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
  cache:
    key: maven
    paths: [backend/.m2/repository/]
  script:
    - cd backend
    - mvn -B verify
    - DATABASE_URL="$TEST_DATABASE_URL" DATABASE_PASSWORD="$POSTGRES_PASSWORD" java -jar target/notesapp-0.1.0.jar --migrate-only
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
frontend:
  stage: test
  image: node:24-alpine
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm/]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run test:gateway
    - npm run build
containers:
  stage: containers
  image: docker:28-cli
  services: [docker:28-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
  rules:
    - if: '$RUN_DOCKER_BUILDS == "true"'
  script:
    - docker compose build
