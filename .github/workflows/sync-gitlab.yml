
name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to GitLab
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -eu

          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GITLAB_USERNAME" ;;
            *Password*) printf '%s\n' "$GITLAB_TOKEN" ;;
          esac
          EOF

          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          export GIT_TERMINAL_PROMPT=0

          git push \
            https://gitlab.com/cmarzian91-group/notesapp.git \
            HEAD:refs/heads/main
