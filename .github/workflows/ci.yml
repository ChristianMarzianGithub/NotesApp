name: Validate NotesApp
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: notesapp_test
          POSTGRES_USER: notesapp
          POSTGRES_PASSWORD: notesapp_dev_only
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U notesapp -d notesapp_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
        working-directory: backend
      - run: java -jar target/notesapp-0.1.0.jar --migrate-only
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:55432/notesapp_test
          DATABASE_USER: notesapp
          DATABASE_PASSWORD: notesapp_dev_only
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run test:gateway && npm run build
        working-directory: frontend
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: bash -n scripts/deploy-cloud-run.sh
  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - run: docker compose -f docker-compose.yml -f docker-compose.cloudrun-test.yml up --build -d --wait --wait-timeout 180
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker compose logs && docker compose down
        if: always()
