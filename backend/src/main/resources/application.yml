spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notesapp}
    username: ${DATABASE_USER:notesapp}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  port: ${PORT:8080}
  error:
    include-message: never
