# Isolated database for tests; never point the test suite at a database with real notes.
services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notesapp_test
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp_dev_only
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U notesapp -d notesapp_test']
      interval: 2s
      timeout: 3s
      retries: 20
